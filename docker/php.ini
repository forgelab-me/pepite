; Matches src/public/.user.ini, the limits shared hosting picks up from the
; web root — kept identical so a push that fits on one deployment fits on
; both. App\Config\Pepite::$maxUploadBytes caps a single push at 100 MB;
; post_max_size needs headroom above that for the rest of the multipart body.
upload_max_filesize = 100M
post_max_size = 105M
memory_limit = 256M
max_execution_time = 120

expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
